name: Validate Apollo 11 SysML v2 Model

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-apollo:
    runs-on: ubuntu-latest

    env:
      SYSML_TOOLKIT_VERSION: v0.9.1
      SYSML_RELEASE_VERSION: "2026-08"
      APOLLO_REPO: https://github.com/airbus/apollo-11-sysml-v2.git
      APOLLO_REF: main

    steps:

      # ------------------------------------------------------------
      # Install released sysml-toolkit binary
      # ------------------------------------------------------------
      - name: Install sysml-toolkit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_API="https://api.github.com/repos/Open-MBEE/sysml-toolkit/releases/tags/${SYSML_TOOLKIT_VERSION}"
          RELEASE_JSON="${RUNNER_TEMP}/sysml-toolkit-release.json"

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${RELEASE_API}" \
            -o "${RELEASE_JSON}"

          mapfile -t ASSET_INFO < <(
            python3 - "${RELEASE_JSON}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              release = json.load(f)

          candidates = []

          for asset in release.get("assets", []):
              name = asset["name"]
              lower = name.lower()

              if "linux" not in lower:
                  continue

              if not any(
                  arch in lower
                  for arch in ("x86_64", "amd64", "x64")
              ):
                  continue

              if any(
                  x in lower
                  for x in ("sha256", "checksum", ".sig", ".asc")
              ):
                  continue

              score = 0

              if "sysmlv2" in lower:
                  score += 100

              if lower.endswith(
                  (".tar.gz", ".tgz", ".tar.xz", ".zip")
              ):
                  score += 50

              if "musl" in lower:
                  score += 10

              candidates.append(
                  (
                      score,
                      name,
                      asset["browser_download_url"],
                  )
              )

          if not candidates:
              print(
                  "No Linux x86-64 sysml-toolkit asset found",
                  file=sys.stderr,
              )

              for asset in release.get("assets", []):
                  print(asset["name"], file=sys.stderr)

              sys.exit(1)

          candidates.sort(reverse=True)

          _, name, url = candidates[0]

          print(name)
          print(url)
          PY
          )

          ASSET_NAME="${ASSET_INFO[0]}"
          ASSET_URL="${ASSET_INFO[1]}"

          echo "Downloading ${ASSET_NAME}"

          ASSET_PATH="${RUNNER_TEMP}/${ASSET_NAME}"
          EXTRACT_DIR="${RUNNER_TEMP}/sysml-toolkit"
          BIN_DIR="${RUNNER_TEMP}/bin"

          mkdir -p "${EXTRACT_DIR}" "${BIN_DIR}"

          curl -fL \
            --retry 3 \
            -o "${ASSET_PATH}" \
            "${ASSET_URL}"

          case "${ASSET_NAME}" in
            *.tar.gz|*.tgz)
              tar -xzf "${ASSET_PATH}" \
                -C "${EXTRACT_DIR}"
              ;;
            *.tar.xz)
              tar -xJf "${ASSET_PATH}" \
                -C "${EXTRACT_DIR}"
              ;;
            *.zip)
              unzip -q "${ASSET_PATH}" \
                -d "${EXTRACT_DIR}"
              ;;
            *)
              cp "${ASSET_PATH}" \
                "${EXTRACT_DIR}/sysmlv2"
              chmod +x "${EXTRACT_DIR}/sysmlv2"
              ;;
          esac

          SYSMLV2_BIN="$(
            find "${EXTRACT_DIR}" \
              -type f \
              -name sysmlv2 \
              -print \
              -quit
          )"

          if [[ -z "${SYSMLV2_BIN}" ]]; then
              echo "::error::sysmlv2 executable not found"
              find "${EXTRACT_DIR}" -type f -print
              exit 1
          fi

          install \
            -m 0755 \
            "${SYSMLV2_BIN}" \
            "${BIN_DIR}/sysmlv2"

          echo "${BIN_DIR}" >> "${GITHUB_PATH}"

      - name: Show sysml-toolkit version
        run: sysmlv2 --version


      # ------------------------------------------------------------
      # Clone Apollo -- NOT into GITHUB_WORKSPACE
      # ------------------------------------------------------------
      - name: Clone Apollo 11 model
        shell: bash
        run: |
          set -euo pipefail

          APOLLO_DIR="${RUNNER_TEMP}/apollo-11-sysml-v2"

          git clone \
            --depth 1 \
            --branch "${APOLLO_REF}" \
            "${APOLLO_REPO}" \
            "${APOLLO_DIR}"

          APOLLO_SHA="$(
            git -C "${APOLLO_DIR}" rev-parse HEAD
          )"

          echo "APOLLO_DIR=${APOLLO_DIR}" \
            >> "${GITHUB_ENV}"

          echo "APOLLO_SHA=${APOLLO_SHA}" \
            >> "${GITHUB_ENV}"

          echo "Apollo source:"
          echo "  ${APOLLO_REPO}"
          echo "  ref: ${APOLLO_REF}"
          echo "  commit: ${APOLLO_SHA}"


      # ------------------------------------------------------------
      # Get OMG SysML v2 library
      # ------------------------------------------------------------
      - name: Clone SysML v2 standard library
        shell: bash
        run: |
          set -euo pipefail

          LIB_REPO="${RUNNER_TEMP}/SysML-v2-Release"

          git clone \
            --depth 1 \
            --branch "${SYSML_RELEASE_VERSION}" \
            https://github.com/Systems-Modeling/SysML-v2-Release.git \
            "${LIB_REPO}"

          SYSML_LIB_DIR="${LIB_REPO}/sysml.library"

          if [[ ! -d "${SYSML_LIB_DIR}" ]]; then
            echo "::error::sysml.library not found"
            exit 1
          fi

          echo "SYSML_LIB_DIR=${SYSML_LIB_DIR}" \
            >> "${GITHUB_ENV}"


      # ------------------------------------------------------------
      # Discover ONLY files underneath APOLLO_DIR
      # ------------------------------------------------------------
      - name: Discover Apollo SysML files
        id: files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          find "${APOLLO_DIR}" \
            -type f \
            -name '*.sysml' \
            -print0 \
            | sort -z \
            > "${RUNNER_TEMP}/apollo-sysml-files.bin"

          mapfile -d '' -t FILES \
            < "${RUNNER_TEMP}/apollo-sysml-files.bin"

          if [[ "${#FILES[@]}" -eq 0 ]]; then
            echo "::error::No Apollo .sysml files found"
            exit 1
          fi

          echo "Found ${#FILES[@]} Apollo SysML files"

          # Important sanity check:
          # absolutely every input must be inside APOLLO_DIR.
          for file in "${FILES[@]}"; do
            case "${file}" in
              "${APOLLO_DIR}"/*)
                ;;
              *)
                echo "::error::Unexpected model input: ${file}"
                exit 1
                ;;
            esac
          done

          printf '%s\n' \
            "${FILES[@]#${APOLLO_DIR}/}" \
            | tee reports/model-files.txt

          echo "count=${#FILES[@]}" \
            >> "${GITHUB_OUTPUT}"


      # ------------------------------------------------------------
      # Validate Apollo as one multi-file model
      # ------------------------------------------------------------
      - name: Validate Apollo model
        id: validation
        shell: bash
        run: |
          set -uo pipefail

          mapfile -d '' -t FILES \
            < "${RUNNER_TEMP}/apollo-sysml-files.bin"

          set +e

          sysmlv2 check \
            --format json \
            --lib "${SYSML_LIB_DIR}" \
            "${FILES[@]}" \
            > reports/validation.json \
            2> reports/validation.stderr

          STATUS=$?

          set -e

          echo "Validation exit code: ${STATUS}"
          echo "status=${STATUS}" \
            >> "${GITHUB_OUTPUT}"

          exit 0


      # ------------------------------------------------------------
      # Evaluate Apollo as one multi-file model
      # ------------------------------------------------------------
      - name: Evaluate Apollo model
        id: evaluation
        shell: bash
        run: |
          set -uo pipefail

          mapfile -d '' -t FILES \
            < "${RUNNER_TEMP}/apollo-sysml-files.bin"

          set +e

          sysmlv2 eval \
            --lib "${SYSML_LIB_DIR}" \
            "${FILES[@]}" \
            --all \
            > reports/evaluation.txt \
            2> reports/evaluation.stderr

          STATUS=$?

          set -e

          echo "Evaluation exit code: ${STATUS}"
          echo "status=${STATUS}" \
            >> "${GITHUB_OUTPUT}"

          exit 0


      # ------------------------------------------------------------
      # GitHub Job Summary
      # ------------------------------------------------------------
      - name: Generate GitHub report
        if: always()
        shell: bash
        env:
          FILE_COUNT: ${{ steps.files.outputs.count }}
          VALIDATION_STATUS: ${{ steps.validation.outputs.status }}
          EVALUATION_STATUS: ${{ steps.evaluation.outputs.status }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          reports = Path("reports")

          validation_file = reports / "validation.json"
          evaluation_file = reports / "evaluation.txt"
          report_file = reports / "report.md"

          def esc(value):
              """Escape text for a GitHub Markdown table."""
              if value is None:
                  return ""
              return (
                  str(value)
                  .replace("|", "\\|")
                  .replace("\r", " ")
                  .replace("\n", "<br>")
              )

          # ----------------------------------------------------------
          # Validation
          # ----------------------------------------------------------

          findings = []

          if validation_file.exists():
              raw = validation_file.read_text(
                  encoding="utf-8",
                  errors="replace",
              ).strip()

              if raw:
                  try:
                      data = json.loads(raw)

                      # Support either:
                      #   [...]
                      # or:
                      #   {"findings": [...]}
                      if isinstance(data, list):
                          findings = data

                      elif isinstance(data, dict):
                          findings = (
                              data.get("findings")
                              or data.get("diagnostics")
                              or data.get("results")
                              or []
                          )

                  except json.JSONDecodeError:
                      findings = []

          validation_rows = []

          for finding in findings:

              severity = (
                  finding.get("severity")
                  or finding.get("level")
                  or ""
              )

              stage = (
                  finding.get("stage")
                  or finding.get("phase")
                  or ""
              )

              filename = (
                  finding.get("unit")
                  or finding.get("unitName")
                  or finding.get("file")
                  or finding.get("source")
                  or ""
              )

              line = (
                  finding.get("line")
                  or ""
              )

              col = (
                  finding.get("col")
                  or finding.get("column")
                  or ""
              )

              location = ""

              if line:
                  location = str(line)

                  if col:
                      location += f":{col}"

              message = (
                  finding.get("message")
                  or finding.get("description")
                  or ""
              )

              severity_lower = str(severity).lower()

              if severity_lower == "error":
                  severity_display = "❌ Error"

              elif severity_lower in ("warning", "warn"):
                  severity_display = "⚠️ Warning"

              elif severity_lower == "info":
                  severity_display = "ℹ️ Info"

              elif severity_lower == "hint":
                  severity_display = "💡 Hint"

              else:
                  severity_display = severity

              validation_rows.append(
                  (
                      severity_display,
                      stage,
                      filename,
                      location,
                      message,
                  )
              )

          # ----------------------------------------------------------
          # Evaluation
          # ----------------------------------------------------------

          evaluation_rows = []

          if evaluation_file.exists():

              evaluation_text = evaluation_file.read_text(
                  encoding="utf-8",
                  errors="replace",
              )

              for line in evaluation_text.splitlines():

                  line = line.strip()

                  if not line:
                      continue

                  # Typical eval output is expected to look like:
                  #
                  # Package::Object::feature = value
                  #
                  # Split only on the first "=" so expressions/values
                  # containing "=" are preserved.
                  match = re.match(
                      r"^(.*?)\s*=\s*(.*)$",
                      line,
                  )

                  if match:
                      feature = match.group(1).strip()
                      value = match.group(2).strip()

                      evaluation_rows.append(
                          (
                              feature,
                              value,
                          )
                      )

                  else:
                      # Keep non-standard output visible rather than
                      # silently losing it.
                      evaluation_rows.append(
                          (
                              line,
                              "",
                          )
                      )

          # ----------------------------------------------------------
          # Summary
          # ----------------------------------------------------------

          validation_status = os.environ.get(
              "VALIDATION_STATUS",
              "unknown",
          )

          evaluation_status = os.environ.get(
              "EVALUATION_STATUS",
              "unknown",
          )

          validation_label = (
              "✅ Passed"
              if validation_status == "0"
              else "❌ Failed"
          )

          evaluation_label = (
              "✅ Passed"
              if evaluation_status == "0"
              else "❌ Failed"
          )

          report = []

          report.append(
              "# Apollo 11 SysML v2 Validation Report"
          )

          report.append("")

          report.append(
              f"**Apollo commit:** `{os.environ.get('APOLLO_SHA', '')}`  "
          )

          report.append(
              f"**sysml-toolkit:** `{os.environ.get('SYSML_TOOLKIT_VERSION', '')}`  "
          )

          report.append(
              f"**SysML library:** `{os.environ.get('SYSML_RELEASE_VERSION', '')}`"
          )

          report.append("")

          report.append("| Check | Result |")
          report.append("|---|---|")
          report.append(
              f"| SysML files | {os.environ.get('FILE_COUNT', '')} |"
          )
          report.append(
              f"| Validation | {validation_label} |"
          )
          report.append(
              f"| Evaluation | {evaluation_label} |"
          )

          # ----------------------------------------------------------
          # Validation table
          # ----------------------------------------------------------

          report.append("")
          report.append("## Validation Results")
          report.append("")

          if validation_rows:

              report.append(
                  "| Severity | Stage | File | Location | Message |"
              )

              report.append(
                  "|---|---|---|---:|---|"
              )

              for (
                  severity,
                  stage,
                  filename,
                  location,
                  message,
              ) in validation_rows:

                  report.append(
                      f"| {esc(severity)} "
                      f"| {esc(stage)} "
                      f"| `{esc(filename)}` "
                      f"| {esc(location)} "
                      f"| {esc(message)} |"
                  )

          else:

              if validation_status == "0":
                  report.append(
                      "✅ No validation findings."
                  )
              else:
                  report.append(
                      "❌ Validation failed, but no structured "
                      "findings were returned."
                  )

          # ----------------------------------------------------------
          # Evaluation table
          # ----------------------------------------------------------

          report.append("")
          report.append("## Evaluation Results")
          report.append("")

          if evaluation_rows:

              report.append(
                  "| Feature / Expression | Value |"
              )

              report.append(
                  "|---|---|"
              )

              for feature, value in evaluation_rows:

                  report.append(
                      f"| `{esc(feature)}` "
                      f"| `{esc(value)}` |"
                  )

          else:

              if evaluation_status == "0":
                  report.append(
                      "No evaluated values were returned."
                  )
              else:
                  report.append(
                      "❌ Evaluation failed before producing values."
                  )

          report.append("")

          report.append(
              f"**Validation findings:** {len(validation_rows)}  "
          )

          report.append(
              f"**Evaluated values:** {len(evaluation_rows)}"
          )

          report_text = "\n".join(report) + "\n"

          report_file.write_text(
              report_text,
              encoding="utf-8",
          )

          summary_file = os.environ.get(
              "GITHUB_STEP_SUMMARY"
          )

          if summary_file:

              with open(
                  summary_file,
                  "a",
                  encoding="utf-8",
              ) as f:
                  f.write(report_text)

          print(report_text)

          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apollo-sysml-validation
          path: reports/
          retention-days: 30


      # ------------------------------------------------------------
      # Final gate
      # ------------------------------------------------------------
      - name: Enforce results
        if: always()
        shell: bash
        run: |
          FAILED=0

          if [[ "${{ steps.validation.outputs.status }}" != "0" ]]; then
            echo "::error::Apollo SysML validation failed"
            FAILED=1
          fi

          if [[ "${{ steps.evaluation.outputs.status }}" != "0" ]]; then
            echo "::error::Apollo SysML evaluation failed"
            FAILED=1
          fi

          exit "${FAILED}"
