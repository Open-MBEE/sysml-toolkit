[package]
name = "sysmlv2-lint"
description = "Configurable lint rules over resolved OMG SysML v2 / KerML models: style, hygiene, and dead-model findings that are project policy rather than language law, with optional auto-fixes"
readme = "../../README.md"
keywords = ["sysml", "kerml", "mbse", "lint"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["src/**", "Cargo.toml"]

[dependencies]
sysmlv2-syntax = { path = "../sysmlv2-syntax", version = "0.9.0" }
sysmlv2-model = { path = "../sysmlv2-model", version = "0.9.0" }
serde_json.workspace = true
regex-lite.workspace = true

[dev-dependencies]
sysmlv2-parser.workspace = true
sysmlv2-testkit.workspace = true
