[package]
name = "sysmlv2-model"
description = "Semantic model layer for OMG SysML v2 / KerML: element graph, name resolution, JSON interchange (compact + full), referential checks, expression evaluation"
readme = "../../README.md"
keywords = ["sysml", "kerml", "mbse", "modeling", "json"]
categories = ["parser-implementations"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["src/**", "build.rs", "Cargo.toml"]

[dependencies]
sysmlv2-syntax = { path = "../sysmlv2-syntax", version = "0.9.1", features = ["serde"] }
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
uuid = { workspace = true, features = ["serde"] }
num-bigint.workspace = true
num-integer.workspace = true
num-rational.workspace = true
num-traits.workspace = true
