[package]
name = "sysmlv2-solve"
description = "SMT solving for OMG SysML v2 / KerML constraints: translates the decidable fragment to SMT-LIB 2 and drives Z3 to find witnesses or prove constraints unsatisfiable or valid"
readme = "../../README.md"
keywords = ["sysml", "kerml", "mbse", "smt", "z3"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["src/**", "Cargo.toml"]

[dependencies]
sysmlv2-syntax = { path = "../sysmlv2-syntax", version = "0.5.5-rc.1" }
sysmlv2-model = { path = "../sysmlv2-model", version = "0.5.5-rc.1" }

[dev-dependencies]
sysmlv2-testkit.workspace = true
